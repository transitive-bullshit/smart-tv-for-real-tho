<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Smart TV · Static overlay experiment</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: Arial, sans-serif;
        color: #eef8f1;
      }
      main {
        position: absolute;
        left: 5%;
        bottom: 8%;
        width: 580px;
        padding: 28px 32px;
        background: rgba(9, 20, 22, 0.88);
        border: 2px solid #b7e5c8;
        border-radius: 18px;
      }
      p {
        margin: 0 0 14px;
        font-size: 24px;
        line-height: 1.4;
      }
      .eyebrow {
        color: #b7e5c8;
        font-size: 18px;
        letter-spacing: 3px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 38px;
        line-height: 1.15;
      }
      button {
        padding: 10px 18px;
        border: 2px solid #b7e5c8;
        border-radius: 8px;
        background: #182e28;
        color: #eef8f1;
        font: inherit;
        font-size: 22px;
      }
      button:focus {
        outline: 3px solid white;
        outline-offset: 5px;
      }
      .note {
        margin: 16px 0 0;
        font-size: 18px;
        color: #c3d1c8;
      }
    </style>
    <script src="probe.js" defer></script>
  </head>
  <body>
    <main aria-labelledby="title">
      <p class="eyebrow">SMART TV / OVERLAY EXPERIMENT</p>
      <h1 id="title">Your room. Your software.</h1>
      <p>The original picture should stay visible behind this label.</p>
      <button id="dismiss" type="button">Dismiss · Back / OK</button>
      <p class="note" id="status">Closes automatically after 60 seconds.</p>
    </main>
  </body>
</html>
