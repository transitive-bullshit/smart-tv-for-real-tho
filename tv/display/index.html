<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http:; media-src 'self' blob:; img-src 'self' data:"
    />
    <title>Smart TV · Room HUD</title>
    <link rel="stylesheet" href="display.css" />
    <link rel="stylesheet" href="assets/visuals.css" />
    <script src="display.js" defer></script>
    <script src="assets/visuals.js" defer></script>
  </head>
  <body data-visual="idle" data-motion="full">
    <div class="preview-scene" aria-hidden="true">
      <div class="scene-grid"></div>
      <span class="scene-caption"
        >NATIVE PICTURE<br /><strong
          >Your content stays center stage.</strong
        ></span
      ><span class="scene-number">03</span>
    </div>
    <div id="preview-controls" hidden></div>
    <div id="visual-root"></div>
    <main class="hud" id="hud" aria-labelledby="title">
      <div class="hud-top">
        <span class="brand">S / TV <span>PERSONAL INTELLIGENCE</span></span
        ><span class="connection" id="connection">STANDBY</span>
      </div>
      <div class="hud-body">
        <div class="core" id="orb-root" aria-hidden="true"></div>
        <div class="copy" aria-live="polite">
          <p class="phase" id="phase">ROOM LINK</p>
          <h1 id="title">Your room.<br />Your software.</h1>
          <p class="detail" id="detail"></p>
          <p class="message" id="message">Ready when you are.</p>
        </div>
      </div>
      <div class="hud-bottom">
        <span class="source"><b></b><span id="source">ROOM</span></span
        ><span class="signal" aria-hidden="true"
          ><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span
        ><button id="dismiss" type="button">BACK <span>/ DISMISS</span></button>
      </div>
      <div id="glow-root" aria-hidden="true"></div>
      <p id="status" class="sr-only">Waiting for controller</p>
    </main>
  </body>
</html>
